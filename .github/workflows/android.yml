# Builds an installable Android app (APK) on every push to main.
# Download it from the "ZEVU för Android (beta)" release on the repository page.
name: ZEVU Android app (APK)
on:
  push:
    branches: [main]
    paths-ignore: ['public/prices/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    # Google sign-in (Supabase); without these secrets the app simply has no sign-in
    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The runner image already includes the Android SDK (ANDROID_HOME).
      - run: npm ci
      - run: npx tsx scripts/build-price-bundles.ts
      - run: npx vite build && node scripts/slim-dist.mjs && npx cap sync android
      # With the ANDROID_KEY_SECRET secret: a release build (faster, not
      # debuggable) signed with the same key every time, so updates install
      # over the app. Without it: a debug build with a throw-away key.
      - name: Build the app
        env:
          ANDROID_KEY_SECRET: ${{ secrets.ANDROID_KEY_SECRET }}
        run: |
          chmod +x android/gradlew
          if [ -n "$ANDROID_KEY_SECRET" ]; then
            node scripts/android-key.mjs
            (cd android && ./gradlew assembleRelease --no-daemon)
            cp android/app/build/outputs/apk/release/app-release.apk ZEVU.apk
          else
            echo "::warning::No ANDROID_KEY_SECRET: debug build with a new key (updates need a fresh install)"
            (cd android && ./gradlew assembleDebug --no-daemon)
            cp android/app/build/outputs/apk/debug/app-debug.apk ZEVU.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: zevu-apk
          path: ZEVU.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: ZEVU för Android (beta)
          body: Betaversion av ZEVU för Android. Ladda ner ZEVU.apk på telefonen och tillåt installation från den här källan när telefonen frågar.
          files: ZEVU.apk
          make_latest: true
      # the file from before the app was renamed
      - name: Remove the old APK name from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset android-latest hintaopas.apk -y -R ${{ github.repository }} || true
