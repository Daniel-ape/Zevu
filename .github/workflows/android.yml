# Builds an installable Android app (debug APK) on every push to main.
# Download it from the "ZEVU för Android (beta)" release on the repository page.
name: ZEVU Android app (APK)
on:
  push:
    branches: [main]
    paths-ignore: ['public/prices/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    # Google sign-in (Supabase); without these secrets the app simply has no sign-in
    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The runner image already includes the Android SDK (ANDROID_HOME).
      - run: npm ci
      - run: npx tsx scripts/build-price-bundles.ts
      - run: npx vite build && npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ZEVU.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zevu-apk
          path: ZEVU.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: ZEVU för Android (beta)
          body: Betaversion av ZEVU för Android. Ladda ner ZEVU.apk på telefonen och tillåt installation från den här källan när telefonen frågar.
          files: ZEVU.apk
          make_latest: true
