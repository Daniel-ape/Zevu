# Builds an installable Android app (debug APK) on every push to main.
# Download it from the "Android app" release on the repository page.
name: Android app (APK)
on:
  push:
    branches: [main]
    paths-ignore: ['public/prices/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The runner image already includes the Android SDK (ANDROID_HOME).
      - run: npm ci
      - run: npx tsx scripts/build-price-bundles.ts
      - run: npx vite build && npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk hintaopas.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hintaopas-apk
          path: hintaopas.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android app (latest build)
          body: Install hintaopas.apk on an Android phone (allow installing from this source when asked).
          files: hintaopas.apk
          make_latest: true
