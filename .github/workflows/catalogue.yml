# Rebuilds the bundled product catalogue (public/products) from Open Food Facts
# and adds pictures for products that don't have one yet. Runs every Sunday
# night (the picture server is quieter then) and by hand from the Actions tab.
name: Build catalogue
on:
  schedule:
    - cron: '7 0 * * 0'   # Sunday 02:07 Finnish time
  workflow_dispatch:
    inputs:
      max:
        description: 'How many products to fetch'
        default: '8000'
      images:
        description: 'How many new pictures to fetch (0 = none)'
        default: '3000'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: pip install pillow
      - run: node scripts/fetch-off.mjs ${{ inputs.max || '10000' }}
      - name: Pictures
        run: |
          node scripts/reuse-images.mjs
          if [ "${{ inputs.images || '3000' }}" != "0" ]; then
            python3 scripts/snapshot-images.py raw.json ${{ inputs.images || '3000' }} 80
          fi
      - run: npx tsx scripts/build-snapshot.ts raw.json
      - name: Commit catalogue
        run: |
          git config user.name "hintaopas-bot"
          git config user.email "hintaopas-bot@users.noreply.github.com"
          git add public/products
          git diff --cached --quiet || (git commit -m "Rebuild product catalogue" && git pull --rebase && git push)
