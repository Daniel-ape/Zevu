# One-off look at shops that could be added: their robots.txt and whether a
# product sitemap exists. Reads only robots.txt and sitemap files.
name: Check candidate shops
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: robots.txt and sitemaps
        run: |
          UA="HintaopasBot/0.1 (+https://github.com/Daniel-ape/zevu; price comparison)"
          for site in www.kauppahalli24.fi www.fiksuruoka.fi www.alko.fi www.puuilo.fi www.fitnesstukku.fi www.ruokaboksi.fi www.mathem.fi www.foodie.fi www.hongkong.fi www.motonet.fi www.lidl.fi www.minimani.fi www.tokmanni.fi www.k-ruoka.fi www.s-kaupat.fi www.clasohlson.com www.bodylab.fi www.myprotein.fi www.sokos.fi www.halpahalli.fi www.citymarket.fi www.ruoka.fi www.kauppa24.fi www.prisma.fi; do
            echo "=================== $site"
            curl -s -m 15 -A "$UA" -o /tmp/r.txt -w "robots: HTTP %{http_code}\n" "https://$site/robots.txt" || echo "robots: failed"
            head -c 2500 /tmp/r.txt | grep -iE "user-agent|disallow|allow|sitemap|crawl" | head -40
          done
