# One-off look at shops that could be added: robots.txt, sitemaps, and whether
# one product page carries a barcode (GTIN) and price in schema.org JSON-LD.
name: Check candidate shops
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: sitemaps and one product page each
        run: |
          UA="HintaopasBot/0.1 (+https://github.com/Daniel-ape/zevu; price comparison)"
          g() { curl -s -L -m 30 -A "$UA" "$1"; }
          for site in www.fiksuruoka.fi www.puuilo.fi www.fitnesstukku.fi; do
            echo "=================== $site"
            g "https://$site/robots.txt" | grep -i sitemap
            for sm in $(g "https://$site/robots.txt" | grep -i '^sitemap' | awk '{print $2}' | tr -d '\r') https://$site/sitemap.xml https://$site/sitemap_index.xml; do
              echo "--- $sm"; g "$sm" | head -c 1500 | grep -o '<loc>[^<]*</loc>' | head -8
            done
            sleep 10
          done
