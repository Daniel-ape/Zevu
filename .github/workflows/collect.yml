# Collects Tokmanni prices once a day and publishes them with the web app.
name: Collect prices
on:
  schedule:
    - cron: '17 3 * * *'   # 05:17 Finnish time (winter)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
jobs:
  tokmanni:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node collector/tokmanni.mjs
      - name: Commit new prices
        run: |
          git config user.name "hintaopas-bot"
          git config user.email "hintaopas-bot@users.noreply.github.com"
          git add public/prices
          git diff --cached --quiet || (git commit -m "Update Tokmanni prices" && git push)
