# Collects Tokmanni prices once a day and publishes them with the web app.
name: Collect prices
on:
  schedule:
    - cron: '17 3 * * *'   # 05:17 Finnish time (winter)
    - cron: '17 15 * * *'  # 17:17 Finnish time
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
jobs:
  tokmanni:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node collector/tokmanni.mjs
      - name: Commit new prices
        run: |
          git config user.name "hintaopas-bot"
          git config user.email "hintaopas-bot@users.noreply.github.com"
          git add public/prices
          git diff --cached --quiet && exit 0
          git commit -q -m "Update Tokmanni prices"
          for i in 1 2 3 4 5 6; do git pull --rebase -q -X theirs && git push -q && exit 0; sleep $((RANDOM % 30 + 10)); done
          exit 1
