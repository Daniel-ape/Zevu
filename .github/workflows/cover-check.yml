# TEMPORARY: downloads every leaflet cover into one contact sheet (branch probe-data) to check them by eye.
name: cover-check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node collector/leaflets.mjs > /dev/null
      - run: sudo apt-get install -y -q imagemagick >/dev/null
      - run: |
          mkdir -p out/c && cd out/c
          node -e "
            const d=require('../../public/prices/leaflets.json');let i=0;const L=[];
            for(const [k,v] of Object.entries(d)) if(Array.isArray(v)) for(const l of v) if(l.image) L.push([String(i++).padStart(2,'0')+'-'+k,l.image,l.name,l.from||'',l.until||'']);
            require('fs').writeFileSync('list.tsv',L.map(x=>x.join('\t')).join('\n'))"
          while IFS=$'\t' read -r id url name from until; do
            curl -sL -A 'HintaopasBot/0.1 (+https://github.com/Daniel-ape/hintaopas; price comparison)' -o "$id.img" "$url" || true
            convert "$id.img[0]" -resize 240x340 -background white -gravity center -extent 240x340 -gravity south -fill black -undercolor '#fffc' -pointsize 13 -annotate +0+4 "$id $(echo "$name" | cut -c1-26) $until" "$id.png" 2>/dev/null || convert -size 240x340 xc:pink -gravity center -pointsize 14 -annotate +0+0 "$id FAILED" "$id.png"
          done < list.tsv
          montage $(ls *.png | sort) -tile 6x -geometry +6+6 ../sheet.png
          cp list.tsv ../ && cp ../../public/prices/leaflets.json ../
          cd .. && rm -rf c && git init -q && git checkout -q -b probe-data && git add . && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm covers
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-data
