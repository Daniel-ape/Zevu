name: iOS build

# Builds the iPhone app on a Mac with Xcode 26 (needed for Liquid Glass),
# runs it in the iPhone simulator and saves a screenshot, and builds an
# unsigned Hintaopas.ipa for iPhones. The .ipa is published on the release
# "iphone" (a fixed download link); Sideloadly on a Windows PC signs it with
# the user's own Apple ID when installing.
on:
  push:
    branches: [main]
    paths: ['ios/**', 'src/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/build-price-bundles.ts
      - run: npm run build
      - run: npx cap sync ios

      - name: Pick Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Build for simulator
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -60
          test -d build/Build/Products/Debug-iphonesimulator/App.app

      - name: Run in simulator and take screenshots
        # the simulator sometimes fails to start; that must not stop the .ipa
        continue-on-error: true
        working-directory: ios/App
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,l in sorted(d.items(), reverse=True) if 'iOS' in r for x in l if x['name'].startswith('iPhone') and 'Pro' not in x['name']))")
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEV" fi.hintaopas.app
          sleep 20
          mkdir -p shots
          xcrun simctl io "$DEV" screenshot shots/light.png
          xcrun simctl ui "$DEV" appearance dark
          sleep 5
          xcrun simctl io "$DEV" screenshot shots/dark.png

      - name: Build for iPhone (unsigned .ipa)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          APP=build-device/Build/Products/Release-iphoneos/App.app
          test -d "$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry Hintaopas.ipa Payload
          ls -la Hintaopas.ipa

      - name: Publish Hintaopas.ipa on the "iphone" release
        if: github.ref == 'refs/heads/main'
        working-directory: ios/App
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Hintaopas för iPhone, byggd $(date -u +'%Y-%m-%d %H:%M') UTC från ${GITHUB_SHA::7}. Installera med Sideloadly på en Windows-dator (se README)."
          if gh release view iphone >/dev/null 2>&1; then
            gh release upload iphone Hintaopas.ipa --clobber
            gh release edit iphone --notes "$NOTES"
          else
            gh release create iphone Hintaopas.ipa --title "Hintaopas för iPhone" --notes "$NOTES" --latest=false
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: ios/App/shots/

      - name: Publish screenshots to the ios-shots branch
        if: success() && hashFiles('ios/App/shots/*.png') != ''
        run: |
          cd ios/App/shots
          git init -q && git checkout -q -b ios-shots
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add . 
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "iOS screenshots ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ios-shots
