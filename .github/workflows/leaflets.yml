# Finds the stores' current leaflets (links, names, cover pictures) twice a day,
# then reads the offers out of the leaflet PDFs (collector/offers.mjs).
name: Collect leaflets
on:
  schedule:
    - cron: '41 4 * * *'    # morning: Lidl's and Tokmanni's new leaflets
    - cron: '23 14 * * *'   # afternoon: leaflets published for the next days
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: leaflets
jobs:
  leaflets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node collector/leaflets.mjs
      - run: sudo apt-get install -y -q poppler-utils >/dev/null
      - run: node collector/offers.mjs
        continue-on-error: true
      - name: Commit leaflet links
        run: |
          git config user.name "hintaopas-bot"
          git config user.email "hintaopas-bot@users.noreply.github.com"
          git add public/prices/leaflets.json public/prices/offers.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Update leaflet links"
          for i in 1 2 3 4 5 6; do git pull --rebase -q -X theirs && git push -q && exit 0; sleep $((RANDOM % 30 + 10)); done
          exit 1
