name: Collect Open Prices
# Open Prices (Open Food Facts): prices people report in Finnish shops.
on:
  schedule:
    - cron: '27 5 * * *'
    - cron: '27 16 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node collector/openprices.mjs
      - name: Commit prices
        run: |
          git config user.name "hintaopas-bot"
          git config user.email "hintaopas-bot@users.noreply.github.com"
          git add -A public/prices
          git diff --cached --quiet && exit 0
          git commit -q -m "Update Open Prices"
          for i in 1 2 3 4 5 6; do git pull --rebase -q -X theirs && git push -q && exit 0; sleep $((RANDOM % 30 + 10)); done
          exit 1
