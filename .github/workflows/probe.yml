name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="HintaopasBot/0.1 (+https://github.com/Daniel-ape/hintaopas; price comparison)"
          for u in https://www.minimani.fi/robots.txt https://www.minimani.fi/sitemap.xml https://www.foodie.fi/robots.txt https://www.s-kaupat.fi/robots.txt https://www.k-ruoka.fi/robots.txt; do
            echo "===== $u"; curl -sL -A "$UA" --max-time 30 -w '\n[HTTP %{http_code}]\n' "$u" | head -40; sleep 3
          done
          echo "===== minimani shop links"; curl -sL -A "$UA" https://www.minimani.fi/ | grep -oiE 'href="[^"]*(kauppa|verkkokauppa|tuotteet|shop)[^"]*"' | sort -u | head
