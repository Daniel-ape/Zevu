name: probe
on: workflow_dispatch
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get install -y -q poppler-utils imagemagick >/dev/null
      - run: node collector/offers.mjs 2>&1 | tail -40
      - run: |
          mkdir -p dbg && cd dbg
          node -e '
            const d=require("../public/prices/offers.json").offers.filter(o=>o.crop&&o.pageImage)
            const pick=[]; for (const c of ["lidl","minimani","rusta","halpahalli"]) pick.push(...d.filter(o=>o.chain===c).slice(0,c==="lidl"?28:12))
            for (const o of pick) console.log([o.pageImage,o.crop.slice(0,4).join(","),o.chain,(o.name+" "+(o.priceCents/100).toFixed(2)).replace(/[^\p{L}\d .,-]/gu,"")].join("\t"))' > list.tsv
          i=0
          while IFS=$'\t' read url box chain name; do
            i=$((i+1)); f=$(printf "%03d" $i)
            curl -sL -A "HintaopasBot/0.1 (+https://github.com/Daniel-ape/hintaopas; price comparison)" "$url" -o p$f.img || continue
            IFS=, read x y w h <<< "$box"
            read W H <<< "$(identify -format "%w %h" p$f.img[0] 2>/dev/null)" || continue
            read X Y CW CH <<< "$(python3 -c "print(int($x*$W),int($y*$H),int($w*$W),int($h*$H))")"
            convert p$f.img[0] -crop ${CW}x${CH}+${X}+${Y} +repage -resize 300x300 -background white -gravity center -extent 300x300 \
              -gravity south -background "#eee" -splice 0x26 -pointsize 14 -annotate +0+5 "$f $chain ${name:0:38}" t$f.png
          done < list.tsv
          montage t*.png -tile 5x -geometry +5+5 sheet.png
          ls -la sheet.png
      - run: |
          mkdir /tmp/out && cp dbg/sheet.png /tmp/out/ && cp public/prices/offers.json /tmp/out/
          cd /tmp/out && git init -q && git checkout -q -b debug-crops && git -c user.name=bot -c user.email=bot@users.noreply.github.com add . && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm dbg
          git push -f -q https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git debug-crops
