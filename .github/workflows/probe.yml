name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="HintaopasBot/0.1 (+https://github.com/Daniel-ape/hintaopas; price comparison)"
          curl -s -A "$UA" -o a.json "https://www.lidl.fi/q/api/category/h/juomat/h10071022?assortment=FI&locale=fi_FI&version=v2.0.0&pageId=10068374%2F10071022&newArticleFlag=1&offset=0&fetchsize=1000"
          wc -c a.json
          node -e '
          const d=JSON.parse(require("fs").readFileSync("a.json"));
          const it=(d.items||[]).filter(x=>x.gridbox);
          console.log("numFound",d.numFound,"items",it.length);
          const s=JSON.stringify(it[0]); const i=s.indexOf("\"ean"); console.log("ean ctx", s.slice(i-200,i+200));
          let withEan=0, withPrice=0, online=0;
          for (const x of it){const g=x.gridbox.data; const ss=JSON.stringify(g); if(/"ean[s]?":\s*"?\[?"?\d{8}/.test(ss)) withEan++; if(g.price?.price>0) withPrice++; if(g.online) online++;}
          console.log({withEan,withPrice,online});
          for (const x of it.filter((_, i)=>i%30==0)){const g=x.gridbox.data; console.log(g.fullTitle,"|",g.price?.price,"|",g.price?.packaging?.text,"|",g.keyfacts?.wonCategoryPrimary, "|", JSON.stringify(g).match(/"ean[^,]*/)?.[0])}
          '
          sleep 4
          curl -s -A "$UA" -o b.json "https://www.lidl.fi/q/api/category/h/lihat/h10095752?assortment=FI&locale=fi_FI&version=v2.0.0&newArticleFlag=1&offset=0&fetchsize=1000"
          node -e 'const d=JSON.parse(require("fs").readFileSync("b.json"));console.log("lihat numFound",d.numFound,"items",(d.items||[]).filter(x=>x.gridbox).length)'
