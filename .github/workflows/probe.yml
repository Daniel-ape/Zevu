name: probe
on: workflow_dispatch
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mkdir -p /tmp/s && cd /tmp/s && npm init -y >/dev/null && npm i -s playwright@1 && npx playwright install --with-deps chromium >/dev/null
      - run: cp .github/shots/shoot.mjs /tmp/s/ && cd /tmp/s && mkdir shots && node shoot.mjs
      - run: |
          cd /tmp/s/shots && git init -q && git checkout -q -b debug-shots && git -c user.name=bot -c user.email=bot@users.noreply.github.com add . && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm shots
          git push -f -q https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git debug-shots
