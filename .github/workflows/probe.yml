name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="HintaopasBot/0.1 (+https://github.com/Daniel-ape/hintaopas; price comparison)"
          curl -s -A "$UA" "https://endpoints.leaflets.schwarz/v4/flyer?flyer_identifier=koko-suomen-tarjoukset-to-5-11-su-8-11&region_id=0&region_code=0" > f.json
          python3 - <<'PY'
          import json
          f=json.load(open('f.json'))['flyer']
          print('flyer keys', list(f.keys()))
          p=f['pages'][1]; print('page keys', list(p.keys()))
          for k,v in p.items():
              s=json.dumps(v)[:600]; print('PAGE', k, s)
          for k in f:
              if k!='pages': print('FLY', k, json.dumps(f[k])[:300])
          PY
