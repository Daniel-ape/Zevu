name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="HintaopasBot/0.1 (+https://github.com/Daniel-ape/hintaopas; price comparison)"
          curl -sL -A "$UA" https://www.minimani.fi/sitemap/sitemap.xml > s.xml; head -c 600 s.xml; echo; grep -c '<loc>' s.xml
          for m in $(grep -o '<loc>[^<]*' s.xml | sed 's/<loc>//' | grep -i 'xml$' | head -5); do echo "-- $m"; curl -sL -A "$UA" $m > m.xml; grep -c '<loc>' m.xml; grep -o '<loc>[^<]*' m.xml | sed 's/<loc>//' | awk 'NR%400==1' | head -12; sleep 2; done
          grep -o '<loc>[^<]*' s.xml | sed 's/<loc>//' | grep -v 'xml$' | awk 'NR%300==1' | head -20
          echo "== top categories"; curl -sL -A "$UA" https://www.minimani.fi/ | grep -oE 'href="https://www.minimani.fi/[a-z0-9-]+\.html"' | sort -u | head -40
          sleep 3
          P=$(curl -sL -A "$UA" https://www.minimani.fi/liha-ja-kana.html 2>/dev/null | grep -oE 'href="https://www.minimani.fi/[a-z0-9-]+\.html"' | head -3); echo "liha page links: $P"
          U=$(grep -o '<loc>[^<]*' s.xml | sed 's/<loc>//' | grep -v 'xml$' | grep -iE 'jauheliha|maito|banaani|kana' | head -3); echo "food urls: $U"
          F=$(echo "$U" | head -1); [ -n "$F" ] && { curl -sL -A "$UA" "$F" > p.html; grep -oE '"(gtin13|gtin|sku|price|priceCurrency|availability|name)"\s*:\s*"?[^",}]*' p.html | head -10; grep -oE 'data-price-amount="[^"]*"' p.html | head -2; }
