name: probe
on: workflow_dispatch
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo udevadm control --reload-rules || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          gh release download android-latest -p hintaopas.apk
          cp .github/probe/* . && npm init -y >/dev/null && npm i -s playwright@1
        env: { GH_TOKEN: '${{ github.token }}' }
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash android-demo.sh
      - if: always()
        run: |
          cd out && git init -q && git checkout -q -b debug-android-demo && git -c user.name=bot -c user.email=bot@users.noreply.github.com add . && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm android
          git push -f -q https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git debug-android-demo
