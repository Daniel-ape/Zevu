name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="HintaopasBot/0.1 (+https://github.com/Daniel-ape/hintaopas; price comparison)"
          one() { # name sitemap grep-regex
            echo "== $1"
            curl -sL -A "$UA" --max-time 60 "$2" -o s.xml; file s.xml | grep -q gzip && { mv s.xml s.gz; gunzip -c s.gz > s.xml; }
            echo "locs $(grep -o '<loc>' s.xml | wc -l)"; grep -o '<loc>[^<]*</loc>' s.xml | sed 's/<[^>]*>//g' > locs.txt; head -3 locs.txt
            U=$(grep -E "$3" locs.txt | sed -n '50p'); [ -z "$U" ] && U=$(grep -E "$3" locs.txt | head -1)
            echo "product $U"
            [ -n "$U" ] && curl -sL -A "$UA" --max-time 30 "$U" -o p.html && echo "page $(wc -c < p.html) ld=$(grep -c 'application/ld+json' p.html)" && grep -o -E '"(gtin13|gtin|gtin8|gtin14|ean|sku|price)" *: *"?[^,"}]{1,20}' p.html | sort -u | head -8; grep -o -iE 'itemprop="gtin13"[^>]{0,60}|ean[^a-z][^<]{0,30}[0-9]{13}' p.html | head -3
          }
          one biltema https://www.biltema.se/globalassets/sitemaps/sitemap-fi-1.xml 'biltema'
          one clasohlson https://www.clasohlson.com/sitemap/sitemap_product_fi.xml '/fi/'
          one motonet https://www.motonet.fi/sitemap-0.xml 'tuote|/fi/'
          one puuilo https://www.puuilo.fi/media/sitemap/fi_sitemap.xml 'puuilo.fi/[a-z]'
          one byggmax https://www.byggmax.fi/pub/media/Sitemap_fi_fi_product.xml '/[0-9]{5,}-|byggmax.fi/[a-z0-9-]+$'
          one intersport https://www.intersport.fi/fi/sitemap.xml 'intersport'
          one sotka https://www.sotka.fi/sitemap/index.xml 'sotka'
          one mekonomen https://www.mekonomen.fi/sitemap_index.xml 'mekonomen'
          one suomalainen https://www.suomalainen.com/sitemap.xml 'suomalainen'
          curl -s -A "$UA" https://www.xxl.fi/robots.txt | head -30
          true
