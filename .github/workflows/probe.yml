name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="HintaopasBot/0.1 (+https://github.com/Daniel-ape/hintaopas; price comparison)"
          g(){ curl -sL -A "$UA" --max-time 40 "$1"; }
          g https://www.lidl.fi/c/ruoka-ja-juoma/s10068374 > r.html
          echo "=== h links"; grep -o 'href="/h/[^"]*"' r.html | sort -u
          for u in /h/hedelmaet-ja-vihannekset/h10071012 /h/juomat/h10071022; do
            sleep 4; echo "=== $u"; g "https://www.lidl.fi$u" > p.html; wc -c p.html
            echo "product links: $(grep -o '/p/[a-z0-9-]*/p[0-9]*' p.html | sort -u | wc -l)"
            grep -o '/p/[a-z0-9-]*/p[0-9]*' p.html | sort -u | head -5
            grep -oE '"(numFound|totalCount|total|offset|fetchsize|itemsPerPage)":[0-9]+' p.html | sort | uniq -c | head
            grep -o 'offset=[0-9]*' p.html | sort -u | head
          done
          sleep 4; echo "=== product page"; g "https://www.lidl.fi$(grep -o '/p/[a-z0-9-]*/p[0-9]*' p.html | head -1)" > q.html; grep -o 'application/ld+json[^<]*' q.html | head -c 1500
