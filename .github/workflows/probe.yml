name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="HintaopasBot/0.1 (+https://github.com/Daniel-ape/hintaopas; price comparison)"
          for u in https://www.minimani.fi/arla-luonto-ab-mansikkajogurtti-lakton-175-g.html https://www.minimani.fi/apetit-pullea-sokeriherne-300-g.html; do
            curl -sL -A "$UA" "$u" > p.html; echo "=== $u $(wc -c < p.html)"
            grep -oE 'application/ld\+json[^<]{0,1500}' p.html | head -3
            grep -oiE '(gtin|ean|barcode|viivakoodi)[^<]{0,80}' p.html | head -8
            grep -oE 'data-price-amount="[^"]*"|itemprop="price"[^>]*|"price":"?[0-9.]+' p.html | head -4
            grep -oE '<h1[^>]*>[^<]*<span[^>]*>[^<]*' p.html | head -2
            sleep 4
          done
