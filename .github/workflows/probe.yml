name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="HintaopasBot/0.1 (+https://github.com/Daniel-ape/hintaopas; price comparison)"
          curl -sL -A "$UA" https://www.minimani.fi/arla-luonto-ab-mansikkajogurtti-lakton-175-g.html > p.html
          python3 - <<'PY'
          import re,json
          s=open('p.html',encoding='utf-8').read()
          for m in re.finditer(r'application/ld\+json">(.*?)</script>', s, re.S):
              t=m.group(1)
              if '"Product"' in t:
                  d=json.loads(t); d.pop('description',None); print(json.dumps(d,ensure_ascii=False)[:1500])
          for k in ['gtin','ean','EAN','Viivakoodi','viivakoodi','sku']:
              for mm in list(re.finditer(k, s))[:3]: print(k, '…', s[max(0,mm.start()-80):mm.start()+120].replace('\n',' '))
          PY
