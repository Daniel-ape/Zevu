name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="HintaopasBot/0.1 (+https://github.com/Daniel-ape/hintaopas; price comparison)"
          curl -s -A "$UA" -o a.json "https://www.lidl.fi/q/api/category/h/juomat/h10071022?assortment=FI&locale=fi_FI&version=v2.0.0&pageId=10068374%2F10071022&offset=0&fetchsize=1000"
          wc -c a.json
          node -e '
          const d=JSON.parse(require("fs").readFileSync("a.json"));
          console.log("numFound",d.numFound,"items",d.items?.length, Object.keys(d));
          const it=d.items||[];
          const g=it[0]?.gridbox?.data ?? it[0];
          console.log(JSON.stringify(it[0]).slice(0,3500));
          const s=JSON.stringify(d); console.log("ean-like keys", [...new Set([...s.matchAll(/"(ean[a-zA-Z]*|gtin[a-zA-Z0-9]*|gs1[a-zA-Z]*)"/g)].map(m=>m[1]))]);
          '
