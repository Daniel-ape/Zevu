name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get install -y -q poppler-utils >/dev/null; node collector/probe.mjs
      - run: |
          cd out && git init -q && git checkout -q -b probe-data && git add . 
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm data
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-data
