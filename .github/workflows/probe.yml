name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="HintaopasBot/0.1 (+https://github.com/Daniel-ape/hintaopas; price comparison)"
          for id in 217573 195071; do
          curl -sL -A "$UA" https://www.jimms.fi/fi/Product/Show/$id > p.html
          echo "== $id"; grep -o -E 'itemprop="[a-zA-Z0-9]+"[^>]{0,140}' p.html | grep -v -E 'itemListElement|"item"|position|"name" class|worstRating|bestRating|ratingValue|reviewCount' | head -30
          grep -o -E '.{60}gtin13.{60}' p.html | head -3
          grep -o -i -E '.{40}(varastossa|saatavuus|InStock|OutOfStock).{40}' p.html | head -4
          done
