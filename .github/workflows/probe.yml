name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -q poppler-utils >/dev/null
      - run: |
          UA="HintaopasBot/0.1 (+https://github.com/Daniel-ape/hintaopas; price comparison)"
          B=https://view.publitas.com/minimani-yhtiot-oy/vko46_2026_alkuviikko/
          curl -s -A "$UA" ${B}data.json > d.json; python3 -c "import json;d=json.load(open('d.json'));print(d.get('config',{}).get('downloadPdfUrl'))" > pdfurl
          cat pdfurl; curl -sL -A "$UA" "$(cat pdfurl)" -o l.pdf; ls -la l.pdf; pdfinfo l.pdf | head -12
          pdftotext -l 4 l.pdf - | head -60
          echo "== words"; pdftotext l.pdf - | wc -w
          pdfimages -list l.pdf | head -10
          curl -s -A "$UA" ${B}spreads.json | python3 -c "import json,sys;s=json.load(sys.stdin);p=[x for sp in s for x in sp.get('pages',[])];print(len(p));print((p[0].get('text') or '')[:800])"
          echo "== group page"; curl -s -A "$UA" https://view.publitas.com/minimani-yhtiot-oy/ | grep -o 'minimani-yhtiot-oy/[a-z0-9_-]*' | sort -u | head -30
