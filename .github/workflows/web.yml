# Publishes the web app to GitHub Pages on every push to main.
# The front page is the ZEVU homepage (site/); the web app is at /app/.
name: Web app (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Republish after the daily price collection (its own commit does not trigger a push build).
  workflow_run:
    workflows: ['Collect prices', 'Collect leaflets', 'Collect shop prices', 'Collect Open Prices']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    # Google sign-in (Supabase); without these secrets the app simply has no sign-in
    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsx scripts/build-price-bundles.ts
      # The web app goes to /app/; the ZEVU homepage (site/) is the front page.
      # The daily data stays at the top so the installed app's live address keeps working.
      - run: npx vite build --outDir dist-app
        env:
          VITE_DATA_BASE: ../
      - name: Put the homepage, the app and the data together
        run: |
          mkdir out
          cp -r site/. out/
          mv dist-app out/app
          for d in prices products logos; do mv out/app/$d out/$d; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
