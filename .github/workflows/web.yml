# Publishes the web app to GitHub Pages on every push to main.
# The website is the ZEVU homepage (site/) plus the apps' daily data.
name: Web app (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Republish after the daily price collection (its own commit does not trigger a push build).
  workflow_run:
    workflows: ['Collect prices', 'Collect leaflets', 'Collect shop prices', 'Collect Open Prices']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsx scripts/build-price-bundles.ts
      # The website is the ZEVU homepage (site/). There is no web version of the
      # app; the daily data stays at the top because the installed apps read
      # their live prices from there.
      - name: Put the homepage and the data together
        run: |
          mkdir out
          cp -r site/. out/
          cp -r public/prices public/products public/logos out/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000 # GitHub Pages is sometimes slow to publish
