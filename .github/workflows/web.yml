# Publishes the web app to GitHub Pages on every push to main.
# On iPhone: open the address in Safari → Share → Add to Home Screen.
name: Web app (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Republish after the daily price collection (its own commit does not trigger a push build).
  workflow_run:
    workflows: ['Collect prices', 'Collect leaflets', 'Collect shop prices', 'Collect Open Prices']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    # Google sign-in (Supabase); without these secrets the app simply has no sign-in
    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsx scripts/build-price-bundles.ts
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
