# Publishes the web app to GitHub Pages on every push to main.
# On iPhone: open the address in Safari → Share → Add to Home Screen.
name: Web app (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Republish after the daily price collection (its own commit does not trigger a push build).
  workflow_run:
    workflows: ['Collect prices', 'Collect leaflets']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
