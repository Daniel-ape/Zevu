<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F4F7" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ZEVU" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>ZEVU – Compare More. Spend Less.</title>
    <style>
      /* Start animation: on white the Z is drawn in green, then green fills the screen
         from the Z outward, the Z turns white and the name rises in. Only transform and
         opacity move, so the phone's graphics chip runs it smoothly while the app starts. */
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; overflow: hidden; background: #fff; transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1); }
      #splash.out { opacity: 0; pointer-events: none; }
      #splash .fill { position: absolute; left: 50%; top: 50%; width: 260vmax; height: 260vmax; margin: -130vmax 0 0 -130vmax; border-radius: 50%;
        background: #0e9a57; transform: scale(0); will-change: transform;
        animation: sp-fill 0.75s cubic-bezier(0.32, 0.72, 0, 1) 0.82s forwards; }
      @keyframes sp-fill { to { transform: scale(1); } }
      #splash .sp { position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px; transform: translateY(18px); animation: sp-lift 0.6s cubic-bezier(0.32, 0.72, 0, 1) 1.05s forwards; }
      @keyframes sp-lift { to { transform: none; } }
      #splash .zw { position: relative; width: 97px; height: 92px; }
      #splash .zm { position: absolute; left: 0; top: 0; width: 460px; height: 440px; transform-origin: 0 0; transform: scale(0.21); }
      #splash .zm i { position: absolute; display: block; height: 96px; transform-origin: 0 50%; will-change: transform; }
      #splash .zg i { background: #0e9a57; }
      #splash .zwh { opacity: 0; animation: sp-in 0.3s ease 0.86s forwards; }
      #splash .zwh i { background: #fff; transform: none; }
      #splash .zg .z1 { left: 0; top: 0; width: 460px; transform: scaleX(0); animation: sp-bar 0.26s cubic-bezier(0.5, 0, 0.3, 1) 0.15s forwards; }
      #splash .zd { position: absolute; left: 412px; top: 0; width: 501px; height: 96px; transform-origin: 0 50%; transform: rotate(136.62deg); }
      #splash .zd .z2 { left: 0; top: 0; width: 100%; }
      #splash .zg .zd .z2 { transform: scaleX(0); animation: sp-bar 0.28s cubic-bezier(0.5, 0, 0.3, 1) 0.39s forwards; }
      #splash .zwh .z1, #splash .zwh .z3 { left: 0; width: 460px; }
      #splash .zwh .z1 { top: 0; } #splash .zwh .z3 { top: 344px; }
      #splash .zg .z3 { left: 0; top: 344px; width: 460px; transform: scaleX(0); animation: sp-bar 0.26s cubic-bezier(0.5, 0, 0.3, 1) 0.65s forwards; }
      @keyframes sp-bar { to { transform: scaleX(1); } }
      @keyframes sp-in { to { opacity: 1; } }
      #splash .wm { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: 0.22em; margin-right: -0.22em; color: #fff;
        opacity: 0; transform: translateY(10px); animation: sp-name 0.6s cubic-bezier(0.32, 0.72, 0, 1) 1.12s forwards; }
      @keyframes sp-name { to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #splash *, #splash { animation-duration: 0.01s !important; animation-delay: 0s !important; } }
    </style>
  </head>
  <body>
    <script>
      // The chosen light/dark look before anything is drawn (the start animation follows it).
      document.documentElement.setAttribute('data-theme', 'light') // the app is light only
    </script>
    <div id="splash" aria-hidden="true">
      <i class="fill"></i>
      <div class="sp">
        <div class="zw">
          <div class="zm zg"><i class="z1"></i><b class="zd"><i class="z2"></i></b><i class="z3"></i></div>
          <div class="zm zwh"><i class="z1"></i><b class="zd"><i class="z2"></i></b><i class="z3"></i></div>
        </div>
        <div class="wm">ZEVU</div>
      </div>
    </div>
    <script>
      // Fade the start animation out once it has played and the app is drawn.
      (function () {
        var t0 = Date.now(), ready = false, done = false
        function hide() {
          if (done || !ready) return
          var wait = Math.max(0, 1950 - (Date.now() - t0))
          done = true
          setTimeout(function () {
            var el = document.getElementById('splash')
            if (!el) return
            el.classList.add('out')
            setTimeout(function () { el.remove() }, 480)
          }, wait)
        }
        window.__appReady = function () { ready = true; hide() }
        setTimeout(function () { ready = true; hide() }, 5000) // never stay longer than this
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
