<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F4F7" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ZEVU" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>ZEVU – Compare More. Spend Less.</title>
    <style>
      /* Start animation: the Z is drawn, then it fades into the app. */
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #F4F7F2; color: #0B2219; transition: opacity 0.4s ease, transform 0.4s ease; }
      :root[data-theme='dark'] #splash { background: #0E1311; color: #F4F7F2; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) #splash { background: #0E1311; color: #F4F7F2; } }
      #splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #splash .sp { display: flex; flex-direction: column; align-items: center; gap: 18px; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      /* The Z is three bars that grow in turn. Only transform and opacity change, so the
         phone's graphics chip runs it smoothly even while the app is starting up. */
      #splash .zm { position: relative; width: 460px; height: 440px; transform: scale(0.21); margin: -174px -182px; }
      #splash .zm i { position: absolute; display: block; height: 96px; background: currentColor; transform-origin: 0 50%; will-change: transform; }
      #splash .z1 { left: 0; top: 0; width: 460px; transform: scaleX(0); animation: sp-bar 0.28s cubic-bezier(0.5, 0, 0.3, 1) 0.1s forwards; }
      #splash .zd { position: absolute; left: 412px; top: 0; width: 501px; height: 96px; transform-origin: 0 50%; transform: rotate(136.62deg); }
      #splash .zd .z2 { left: 0; top: 0; width: 100%; transform: scaleX(0); animation: sp-bar 0.32s cubic-bezier(0.5, 0, 0.3, 1) 0.38s forwards; }
      #splash .z3 { left: 0; top: 344px; width: 460px; transform: scaleX(0); animation: sp-bar 0.28s cubic-bezier(0.5, 0, 0.3, 1) 0.7s forwards; }
      @keyframes sp-bar { to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) { #splash .zm i { animation-duration: 0.01s; animation-delay: 0s; } }
    </style>
  </head>
  <body>
    <script>
      // The chosen light/dark look before anything is drawn (the start animation follows it).
      try { var th = JSON.parse(localStorage.getItem('hintaopas:theme') || '"system"'); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th) } catch (e) {}
    </script>
    <div id="splash" aria-hidden="true">
      <div class="sp">
        <div class="zm"><i class="z1"></i><b class="zd"><i class="z2"></i></b><i class="z3"></i></div>
      </div>
    </div>
    <script>
      // Fade the start animation out once it has played and the app is drawn.
      (function () {
        var t0 = Date.now(), ready = false, done = false
        function hide() {
          if (done || !ready) return
          var wait = Math.max(0, 1100 - (Date.now() - t0))
          done = true
          setTimeout(function () {
            var el = document.getElementById('splash')
            if (!el) return
            el.classList.add('out')
            setTimeout(function () { el.remove() }, 450)
          }, wait)
        }
        window.__appReady = function () { ready = true; hide() }
        setTimeout(function () { ready = true; hide() }, 5000) // never stay longer than this
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
