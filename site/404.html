<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ZEVU – Sidan hittades inte</title>
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="/Zevu/img/icon.png" />
<style>
  @font-face { font-family: 'Jakarta'; src: url(/Zevu/fonts/jakarta-800.woff2) format('woff2'); font-weight: 800; }
  @font-face { font-family: 'Jakarta'; src: url(/Zevu/fonts/jakarta-500.woff2) format('woff2'); font-weight: 500; }
  :root { --ink: #12261c; --ink-2: #4e5f55; --paper: #fff; }
  @media (prefers-color-scheme: dark) { :root { --ink: #eef4f0; --ink-2: #b4c2ba; --paper: #0c1611; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: 'Jakarta', system-ui, sans-serif; background: var(--paper); color: var(--ink); text-align: center; padding: 24px; box-sizing: border-box; }
  .tag { display: inline-block; background: #f6da4a; color: #12261c; font-weight: 800; font-size: 56px; letter-spacing: -0.04em; padding: 6px 22px; border-radius: 12px; transform: rotate(-3deg); }
  h1 { font-size: 32px; letter-spacing: -0.03em; margin: 32px 0 10px; }
  p { color: var(--ink-2); font-weight: 500; margin: 0 0 28px; }
  a { display: inline-block; background: #0a7a44; color: #fff; text-decoration: none; font-weight: 800; padding: 13px 24px; border-radius: 999px; }
</style>
</head>
<body>
<main>
  <span class="tag">404</span>
  <h1>Den här sidan finns inte</h1>
  <p>Sivua ei löytynyt. Page not found.</p>
  <a href="/Zevu/">Till startsidan</a>
</main>
</body>
</html>
